<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="fitBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14070a" />
      <stop offset="50%" stop-color="#240c12" />
      <stop offset="100%" stop-color="#100508" />
    </linearGradient>
    <linearGradient id="roseGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fb7185" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>
    <linearGradient id="amberFit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="roseCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(244, 63, 94, 0.15)" />
      <stop offset="100%" stop-color="rgba(36, 12, 18, 0.9)" />
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#fitBg)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="68" fill="#1e090f" opacity="0.95" />
  <line x1="0" y1="68" x2="1280" y2="68" stroke="rgba(244, 63, 94, 0.3)" stroke-width="1" />

  <g transform="translate(60, 20)">
    <circle cx="16" cy="14" r="14" fill="url(#roseGrad)" />
    <path d="M10,14 L14,14 L16,9 L19,19 L21,12 L23,14 L26,14" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="42" y="21" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="800" font-size="20">FitPulse</text>
    <text x="135" y="21" fill="#fb7185" font-family="system-ui, sans-serif" font-weight="500" font-size="12">TACTILE WORKOUT TRACKER</text>
  </g>

  <g transform="translate(1040, 20)">
    <rect width="180" height="30" rx="15" fill="rgba(244, 63, 94, 0.15)" stroke="#f43f5e" stroke-opacity="0.4" />
    <text x="24" y="20" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="12" font-weight="700">🔥 14-Day Streak Active</text>
  </g>

  <!-- Two Mobile-style mockups side-by-side -->
  <g transform="translate(140, 100)">
    <!-- Phone Screen 1: Dashboard -->
    <rect width="460" height="580" rx="36" fill="#1b080e" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2" />
    <!-- Dynamic island notch -->
    <rect x="180" y="16" width="100" height="22" rx="11" fill="#0c0306" />

    <g transform="translate(36, 60)">
      <text x="0" y="20" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">Today's Progress</text>
      <text x="0" y="52" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="800" font-size="26">Crushing Goals 💪</text>

      <!-- Activity Rings -->
      <g transform="translate(195, 140)">
        <!-- Outer ring: Calories -->
        <circle cx="0" cy="0" r="70" fill="none" stroke="rgba(244,63,94,0.15)" stroke-width="12" />
        <circle cx="0" cy="0" r="70" fill="none" stroke="url(#roseGrad)" stroke-width="12" stroke-dasharray="440" stroke-dashoffset="100" stroke-linecap="round" transform="rotate(-90)" />

        <!-- Middle ring: Time -->
        <circle cx="0" cy="0" r="54" fill="none" stroke="rgba(251,191,36,0.15)" stroke-width="12" />
        <circle cx="0" cy="0" r="54" fill="none" stroke="url(#amberFit)" stroke-width="12" stroke-dasharray="340" stroke-dashoffset="60" stroke-linecap="round" transform="rotate(-90)" />

        <!-- Inner ring: Stand -->
        <circle cx="0" cy="0" r="38" fill="none" stroke="rgba(56,189,248,0.15)" stroke-width="12" />
        <circle cx="0" cy="0" r="38" fill="none" stroke="#38bdf8" stroke-width="12" stroke-dasharray="240" stroke-dashoffset="30" stroke-linecap="round" transform="rotate(-90)" />

        <text x="0" y="6" text-anchor="middle" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="800" font-size="18">82%</text>
      </g>

      <!-- Stats Cards -->
      <g transform="translate(0, 240)">
        <rect width="388" height="65" rx="14" fill="#250d14" stroke="rgba(244, 63, 94, 0.2)" />
        <text x="20" y="28" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12">Active Calories</text>
        <text x="20" y="50" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="700" font-size="18">620 / 800 kcal</text>
        <circle cx="340" cy="32" r="14" fill="url(#roseGrad)" />
      </g>

      <g transform="translate(0, 315)">
        <rect width="388" height="65" rx="14" fill="#250d14" stroke="rgba(244, 63, 94, 0.2)" />
        <text x="20" y="28" fill="#fde68a" font-family="system-ui, sans-serif" font-size="12">Workout Duration</text>
        <text x="20" y="50" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="700" font-size="18">52 / 60 mins</text>
        <circle cx="340" cy="32" r="14" fill="url(#amberFit)" />
      </g>

      <g transform="translate(0, 390)">
        <rect width="388" height="65" rx="14" fill="#250d14" stroke="rgba(244, 63, 94, 0.2)" />
        <text x="20" y="28" fill="#bae6fd" font-family="system-ui, sans-serif" font-size="12">Heart Rate Monitor</text>
        <text x="20" y="50" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="700" font-size="18">138 BPM (Peak Zone)</text>
        <circle cx="340" cy="32" r="14" fill="#38bdf8" />
      </g>
    </g>
  </g>

  <!-- Phone Screen 2: Tactical Workout Session -->
  <g transform="translate(680, 100)">
    <rect width="460" height="580" rx="36" fill="#1b080e" stroke="rgba(244, 63, 94, 0.35)" stroke-width="2" />
    <rect x="180" y="16" width="100" height="22" rx="11" fill="#0c0306" />

    <g transform="translate(36, 60)">
      <text x="0" y="20" fill="#fda4af" font-family="system-ui, sans-serif" font-size="13">Active Routine</text>
      <text x="0" y="52" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="800" font-size="26">Upper Body Hypertrophy</text>

      <rect x="0" y="80" width="388" height="180" rx="18" fill="url(#roseCard)" stroke="rgba(244, 63, 94, 0.4)" />
      <text x="24" y="120" fill="#fecdd3" font-family="system-ui, sans-serif" font-size="13">CURRENT EXERCISE (SET 3 OF 4)</text>
      <text x="24" y="155" fill="#fff1f2" font-family="system-ui, sans-serif" font-weight="800" font-size="24">Barbell Bench Press</text>
      <text x="24" y="185" fill="#fda4af" font-family="system-ui, sans-serif" font-size="14">85 kg × 10 Reps · Target RPE 8.5</text>
      <rect x="24" y="205" width="340" height="38" rx="19" fill="url(#roseGrad)" />
      <text x="140" y="229" fill="#14070a" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Complete Set ✓</text>

      <!-- Up Next List -->
      <g transform="translate(0, 280)">
        <text x="0" y="18" fill="#fda4af" font-family="system-ui, sans-serif" font-weight="700" font-size="14">UP NEXT IN SESSION</text>

        <rect x="0" y="32" width="388" height="54" rx="12" fill="#250d14" />
        <text x="20" y="64" fill="#fff1f2" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Incline Dumbbell Flyes</text>
        <text x="360" y="64" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">3 sets · 12 reps</text>

        <rect x="0" y="96" width="388" height="54" rx="12" fill="#250d14" />
        <text x="20" y="128" fill="#fff1f2" font-family="system-ui, sans-serif" font-size="13" font-weight="600">Cable Tricep Pushdowns</text>
        <text x="360" y="128" fill="#fda4af" font-family="system-ui, sans-serif" font-size="12" text-anchor="end">4 sets · 15 reps</text>
      </g>
    </g>
  </g>
</svg>
