<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0c0a09" />
      <stop offset="50%" stop-color="#1c1917" />
      <stop offset="100%" stop-color="#0c0a09" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="goldCard" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(234, 179, 8, 0.12)" />
      <stop offset="100%" stop-color="rgba(28, 25, 23, 0.85)" />
    </linearGradient>
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1280" height="720" fill="url(#bgGrad)" />

  <!-- Subtle Ambient Glow -->
  <circle cx="200" cy="150" r="220" fill="#eab308" opacity="0.06" filter="url(#goldGlow)" />
  <circle cx="1080" cy="550" r="280" fill="#ca8a04" opacity="0.05" filter="url(#goldGlow)" />

  <!-- Navbar -->
  <rect x="0" y="0" width="1280" height="72" fill="#141210" opacity="0.95" />
  <line x1="0" y1="72" x2="1280" y2="72" stroke="#eab308" stroke-opacity="0.25" stroke-width="1" />

  <!-- Logo -->
  <g transform="translate(60, 22)">
    <polygon points="14,2 26,14 14,26 2,14" fill="url(#goldGrad)" />
    <text x="36" y="20" fill="#fafaf9" font-family="system-ui, sans-serif" font-weight="800" font-size="20" letter-spacing="1">INDIGLAM</text>
    <text x="144" y="20" fill="#eab308" font-family="system-ui, sans-serif" font-weight="300" font-size="13" letter-spacing="3">HAUTE JOAILLERIE</text>
  </g>

  <!-- Nav links -->
  <g font-family="system-ui, sans-serif" font-size="14" font-weight="500" fill="#a8a29e">
    <text x="440" y="42" fill="#fef08a">Collections</text>
    <text x="560" y="42">Bridal</text>
    <text x="640" y="42">Solitaires</text>
    <text x="735" y="42">Bespoke</text>
  </g>

  <!-- Auth & Cart -->
  <g transform="translate(1030, 20)">
    <rect x="0" y="0" width="90" height="32" rx="16" fill="rgba(234, 179, 8, 0.15)" stroke="#eab308" stroke-opacity="0.3" />
    <text x="18" y="21" fill="#fef08a" font-family="system-ui, sans-serif" font-size="12" font-weight="600">Cart (3)</text>
    <circle cx="120" cy="16" r="16" fill="#292524" stroke="#eab308" stroke-width="1.5" />
    <text x="114" y="21" fill="#fef08a" font-family="system-ui, sans-serif" font-size="13" font-weight="700">D</text>
  </g>

  <!-- Layout: Sidebar + Main Content -->
  <!-- Sidebar -->
  <g transform="translate(60, 100)">
    <rect width="240" height="580" rx="14" fill="#141210" stroke="rgba(234,179,8,0.2)" stroke-width="1" />
    <text x="24" y="40" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Filters &amp; Metals</text>
    
    <g transform="translate(24, 70)" font-family="system-ui, sans-serif" font-size="13" fill="#d6d3d1">
      <rect x="0" y="0" width="16" height="16" rx="4" fill="#eab308" />
      <text x="28" y="13" fill="#fafaf9">18K Yellow Gold (18)</text>
      
      <rect x="0" y="32" width="16" height="16" rx="4" fill="rgba(234,179,8,0.2)" stroke="#eab308" stroke-width="1" />
      <text x="28" y="45">950 Pure Platinum (12)</text>
      
      <rect x="0" y="64" width="16" height="16" rx="4" fill="rgba(234,179,8,0.2)" stroke="#eab308" stroke-width="1" />
      <text x="28" y="77">Rose Gold Heritage (9)</text>
    </g>

    <line x1="24" y1="180" x2="216" y2="180" stroke="#292524" />

    <text x="24" y="215" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="700" font-size="14">Price Range (₹ INR)</text>
    <rect x="24" y="235" width="192" height="6" rx="3" fill="#292524" />
    <rect x="24" y="235" width="130" height="6" rx="3" fill="url(#goldGrad)" />
    <circle cx="154" cy="238" r="8" fill="#fafaf9" stroke="#ca8a04" stroke-width="2" />
    <text x="24" y="265" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">₹25,000 — ₹4,50,000</text>

    <!-- GSAP / Tech pill -->
    <g transform="translate(24, 490)">
      <rect width="192" height="60" rx="8" fill="rgba(234,179,8,0.06)" stroke="rgba(234,179,8,0.2)" />
      <text x="14" y="24" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="600" font-size="11">STACK POWERED</text>
      <text x="14" y="44" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="11">React 19 · Prisma · GSAP</text>
    </g>
  </g>

  <!-- Main Grid (3 Luxury Product Cards) -->
  <g transform="translate(325, 100)">
    <!-- Card 1 -->
    <g transform="translate(0, 0)">
      <rect width="285" height="390" rx="14" fill="url(#goldCard)" stroke="rgba(234,179,8,0.25)" stroke-width="1" />
      <rect x="18" y="18" width="65" height="24" rx="12" fill="#ca8a04" />
      <text x="28" y="34" fill="#1c1917" font-family="system-ui, sans-serif" font-weight="700" font-size="11">BESTSELLER</text>
      
      <!-- Ring Graphic -->
      <g transform="translate(142, 130)">
        <ellipse cx="0" cy="0" rx="48" ry="42" fill="none" stroke="url(#goldGrad)" stroke-width="8" />
        <polygon points="0,-48 14,-32 -14,-32" fill="#fef08a" filter="url(#goldGlow)" />
        <circle cx="0" cy="-40" r="12" fill="#ffffff" opacity="0.9" />
      </g>

      <text x="20" y="250" fill="#fafaf9" font-family="system-ui, sans-serif" font-weight="700" font-size="17">Aura Solitaire Ring</text>
      <text x="20" y="272" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">18K Yellow Gold · 1.5ct VVS1</text>
      <text x="20" y="310" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="800" font-size="20">₹1,45,000</text>
      
      <rect x="20" y="332" width="245" height="38" rx="8" fill="url(#goldGrad)" />
      <text x="96" y="356" fill="#1c1917" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Add to Bag</text>
    </g>

    <!-- Card 2 -->
    <g transform="translate(305, 0)">
      <rect width="285" height="390" rx="14" fill="url(#goldCard)" stroke="rgba(234,179,8,0.25)" stroke-width="1" />
      <rect x="18" y="18" width="60" height="24" rx="12" fill="rgba(234,179,8,0.2)" stroke="#eab308" />
      <text x="28" y="34" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="700" font-size="11">NEW</text>
      
      <!-- Necklace Graphic -->
      <g transform="translate(142, 130)">
        <path d="M-50,-20 Q0,55 50,-20" fill="none" stroke="url(#goldGrad)" stroke-width="6" />
        <circle cx="0" cy="45" r="14" fill="url(#goldGrad)" />
        <circle cx="0" cy="45" r="7" fill="#ffffff" />
      </g>

      <text x="20" y="250" fill="#fafaf9" font-family="system-ui, sans-serif" font-weight="700" font-size="17">Royal Kundan Choker</text>
      <text x="20" y="272" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">Heritage Handcrafted Polki</text>
      <text x="20" y="310" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="800" font-size="20">₹3,20,000</text>
      
      <rect x="20" y="332" width="245" height="38" rx="8" fill="url(#goldGrad)" />
      <text x="96" y="356" fill="#1c1917" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Add to Bag</text>
    </g>

    <!-- Card 3 -->
    <g transform="translate(610, 0)">
      <rect width="285" height="390" rx="14" fill="url(#goldCard)" stroke="rgba(234,179,8,0.25)" stroke-width="1" />
      <rect x="18" y="18" width="80" height="24" rx="12" fill="rgba(234,179,8,0.2)" stroke="#eab308" />
      <text x="26" y="34" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="700" font-size="11">EXCLUSIVE</text>
      
      <!-- Bracelet Graphic -->
      <g transform="translate(142, 130)">
        <ellipse cx="0" cy="0" rx="46" ry="32" fill="none" stroke="url(#goldGrad)" stroke-width="7" stroke-dasharray="10 4" />
        <circle cx="20" cy="-22" r="8" fill="#ffffff" />
      </g>

      <text x="20" y="250" fill="#fafaf9" font-family="system-ui, sans-serif" font-weight="700" font-size="17">Eternity Tennis Bracelet</text>
      <text x="20" y="272" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="12">950 Platinum · 3.2ct Diamonds</text>
      <text x="20" y="310" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="800" font-size="20">₹2,85,000</text>
      
      <rect x="20" y="332" width="245" height="38" rx="8" fill="url(#goldGrad)" />
      <text x="96" y="356" fill="#1c1917" font-family="system-ui, sans-serif" font-weight="700" font-size="13">Add to Bag</text>
    </g>

    <!-- Bottom Banner / Checkout flow preview -->
    <g transform="translate(0, 415)">
      <rect width="895" height="165" rx="12" fill="#141210" stroke="rgba(234,179,8,0.2)" stroke-width="1" />
      <text x="30" y="40" fill="#fef08a" font-family="system-ui, sans-serif" font-weight="700" font-size="16">Production Checkout Architecture</text>
      <text x="30" y="66" fill="#a8a29e" font-family="system-ui, sans-serif" font-size="13">End-to-end checkout with Google OAuth authentication, PostgreSQL order transactions, and Prisma ORM</text>
      
      <g transform="translate(30, 95)">
        <rect x="0" y="0" width="180" height="42" rx="8" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.3)" />
        <text x="18" y="26" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="13" font-weight="600">✓ Google OAuth 2.0</text>

        <rect x="200" y="0" width="190" height="42" rx="8" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.3)" />
        <text x="18" y="26" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" transform="translate(200,0)">✓ Neon PostgreSQL</text>

        <rect x="410" y="0" width="180" height="42" rx="8" fill="rgba(234,179,8,0.1)" stroke="rgba(234,179,8,0.3)" />
        <text x="18" y="26" fill="#fafaf9" font-family="system-ui, sans-serif" font-size="13" font-weight="600" transform="translate(410,0)">✓ GSAP Fluid Motion</text>
      </g>
    </g>
  </g>
</svg>
